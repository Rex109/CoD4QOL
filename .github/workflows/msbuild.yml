# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: ./cod4qol.sln

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
        matrix:
          configuration:
            - Debug
            - Release
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild /m /p:Configuration=${{matrix.configuration}} ${{env.SOLUTION_FILE_PATH}}

    - name: Rename FastFile
      run: |
        mkdir miles
        mv mod\cod4qol\mod.ff qol.ff
        mv ${{matrix.configuration}}\cod4qol.asi miles\cod4qol.asi
        mv ${{matrix.configuration}}\cod4qol.pdb cod4qol.pdb

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
          name: ${{matrix.configuration}} binaries
          path: |
            miles/
            qol.ff
            cod4qol.pdb

    - name: Package for release
      if: matrix.configuration == 'Release'
      run: |
        mkdir package
        mv miles package\miles
        mv qol.ff package\qol.ff
        Compress-Archive -Path package\* -DestinationPath cod4qol.zip

    - name: Publish nightly
      if: matrix.configuration == 'Release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $sha  = "${{ github.sha }}".Substring(0,7)
        $base = "${{ github.server_url }}/${{ github.repository }}"

        $last = git describe --tags --abbrev=0 --exclude=nightly 2>$null
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($last)) { $last = $null }
        $LASTEXITCODE = 0

        $fmt = "* %s ([%h]($base/commit/%H))"
        if ($last) {
          $header = "### Changes since $last"
          $commits = @(git log --no-merges "--pretty=format:$fmt" "$last..HEAD")
        } else {
          $header = "### Commits"
          $commits = @(git log --no-merges "--pretty=format:$fmt")
        }
        $LASTEXITCODE = 0

        if ($commits.Count -eq 0) {
          $notes = "$header`n`n* No new commits.`n"
        } else {
          $shown  = @($commits | Select-Object -First 5)
          $hidden = @($commits | Select-Object -Skip 5)
          $notes  = "$header`n`n" + ($shown -join "`n") + "`n"
          if ($hidden.Count -gt 0) {
            $notes += "`n<details>`n<summary>Show $($hidden.Count) more commits</summary>`n`n" +
                      ($hidden -join "`n") + "`n`n</details>`n"
          }
        }
        $notes += "`nBuilt from commit [$sha]($base/commit/${{ github.sha }})"

        Set-Content -Path notes.md -Value $notes -Encoding utf8

        gh release delete nightly --yes --cleanup-tag 2>$null
        $LASTEXITCODE = 0
        gh release create nightly cod4qol.zip `
          --title "Nightly ($sha)" `
          --notes-file notes.md `
          --prerelease `
          --target ${{ github.sha }}
